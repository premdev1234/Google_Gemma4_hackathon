let current = 'all';
window.show = async function(key) {
  current = key;
  document.querySelectorAll('.grp-btn').forEach(b=>b.classList.toggle('active', b.textContent.trim().toLowerCase().replace(/[^a-z]/g,'').includes(key==='all'?'all':key)));
  document.getElementById('erd').innerHTML = '<div style="padding:20px;color:var(--color-text-secondary);font-size:13px">Rendering…</div>';
  try {
    const {svg} = await mermaid.render('erd-'+key+'-'+Date.now(), diagrams[key]);
    document.getElementById('erd').innerHTML = svg;
    document.querySelectorAll('#erd svg rect,#erd svg path[d]').forEach(el=>{
      if(el.tagName==='rect'){el.setAttribute('rx','6');}
    });
  } catch(e){
    document.getElementById('erd').innerHTML = '<div style="padding:20px;color:var(--color-text-secondary);font-size:13px">Could not render this view.</div>';
  }
};
